spring.application.name=TeckNest

# ========================
# Server
# ========================
server.port=5050

# ========================
# Database
# ========================
# Uses H2 in-memory by default for local development.
# Override with env vars when using PostgreSQL/Supabase in deployed environments.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:tecknest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Optional local DB browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================
# JWT Configuration
# ========================
# Generate a strong Base64-encoded secret (min 256 bits). Example command:
#   openssl rand -base64 32
app.jwt.secret=CHANGE_ME_TO_A_STRONG_BASE64_SECRET_KEY
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
jwt.secret=CHANGE_ME_TO_A_STRONG_BASE64_SECRET_KEY
jwt.expiration=86400000

# ========================
# Razorpay Payment Gateway
# ========================
# Get these from https://dashboard.razorpay.com > Settings > API Keys
razorpay.key.id=CHANGE_ME_RAZORPAY_KEY_ID
razorpay.key.secret=CHANGE_ME_RAZORPAY_KEY_SECRET

# ========================
# CORS (informational -- actual config is in CorsConfig.java)
# ========================
app.cors.allowed-origins=http://localhost:3000

# ========================
# DevTools
# ========================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ========================
# Logging
# ========================
logging.level.root=INFO
logging.level.com.example.tecknest=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
